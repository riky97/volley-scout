[package]
name = "volley-scout"
version = "0.1.1"
description = "Offline-first volleyball match scouting app"
authors = ["Volley Scout"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "volley_scout_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
base64 = "0.22"
