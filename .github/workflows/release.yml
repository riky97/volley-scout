name: Release

# Publishing is driven by a version tag: `git tag v0.1.1 && git push origin v0.1.1`.
on:
  push:
    tags:
      - 'v*'

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Volley Scout ${{ github.ref_name }}
          releaseBody: |
            Installer per Windows (64 bit).

            - `.exe` — installazione guidata, consigliata
            - `.msi` — pacchetto alternativo

            Windows mostra un avviso SmartScreen perche' l'installer non e' firmato:
            scegliere "Ulteriori informazioni" e poi "Esegui comunque".
          releaseDraft: false
          prerelease: false
